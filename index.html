<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="オフィス課題調査">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>オフィスでのお困り事アンケート</title>
<style>
:root{
  --navy:#0b2b45;
  --blue:#1478b8;
  --cyan:#29b6d1;
  --green:#66bf45;
  --mint:#eaf8f1;
  --ice:#eaf7fc;
  --line:#d4e1e8;
  --text:#153249;
  --muted:#637382;
  --bg:#f7fbfc;
  --white:#fff;
  --danger:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
body{min-height:100%}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{
  max-width:920px;
  margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
}
.header{
  position:relative;
  overflow:hidden;
  background:var(--white);
  border-radius:28px;
  padding:34px 34px 28px;
  box-shadow:0 8px 28px rgba(14,48,69,.08);
  margin-bottom:22px;
}
.header:before{
  content:"";
  position:absolute;
  width:340px;height:150px;right:-85px;top:-70px;
  background:linear-gradient(135deg,#cfefff,#dff8dc);
  border-radius:50%;
  transform:rotate(-10deg);
  opacity:.9;
}
.header:after{
  content:"";
  position:absolute;
  width:220px;height:110px;right:-25px;bottom:-55px;
  background:linear-gradient(135deg,#d7fbef,#dff3ff);
  border-radius:50%;
  opacity:.85;
}
.kicker{font-size:16px;font-weight:800;color:var(--muted);margin:0 0 8px;position:relative;z-index:1}
h1{font-size:clamp(32px,5vw,56px);line-height:1.22;margin:0;color:var(--navy);font-weight:900;letter-spacing:.01em;position:relative;z-index:1}
.accent{width:150px;height:6px;border-radius:999px;background:var(--green);margin:20px 0 16px;position:relative;z-index:1}
.sub{font-size:clamp(18px,2.4vw,26px);font-weight:700;color:var(--muted);margin:0;position:relative;z-index:1}
.topbar{display:flex;justify-content:flex-end;margin:-8px 0 12px}
.admin-link{
  border:none;background:transparent;color:#74828d;font-size:13px;padding:8px 10px;border-radius:10px
}
.choices{display:grid;gap:16px}
.choice{
  width:100%;
  min-height:132px;
  border:1.5px solid var(--line);
  background:var(--white);
  border-radius:26px;
  padding:17px 22px;
  display:grid;
  grid-template-columns:150px 1px minmax(0,1fr);
  gap:24px;
  align-items:center;
  text-align:left;
  box-shadow:0 7px 20px rgba(15,55,76,.07);
  transition:transform .06s ease,border-color .15s ease,box-shadow .15s ease;
}
.choice:active{transform:scale(.992);border-color:#8dbbd1;box-shadow:0 3px 12px rgba(15,55,76,.08)}
.iconbox{
  height:92px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
}
.choice:nth-child(odd) .iconbox{background:var(--ice)}
.choice:nth-child(even) .iconbox{background:var(--mint)}
.sep{height:78px;background:#c6d5dd}
.choice-text{display:flex;align-items:center;gap:20px;min-width:0}
.num{
  width:54px;height:54px;flex:0 0 54px;border:4px solid var(--navy);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--navy)
}
.label{font-size:clamp(28px,4.2vw,44px);font-weight:900;color:var(--navy);line-height:1.15}
svg{display:block}
.footer{
  margin-top:24px;text-align:center;color:#6f7d87;font-size:17px;font-weight:700;letter-spacing:.06em
}
.footerline{display:flex;justify-content:center;align-items:center;gap:16px}
.footerline:before,.footerline:after{content:"";width:120px;height:1px;background:#aebcc5}
.footer-note{margin-top:10px;font-size:12px;font-weight:500;color:#8a969f}
.thanks{
  background:var(--white);border:1px solid var(--line);border-radius:28px;
  padding:80px 24px;text-align:center;box-shadow:0 8px 28px rgba(14,48,69,.08)
}
.check{
  width:86px;height:86px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#e5f8e7;color:#25933e;font-size:48px;font-weight:900
}
.thanks h2{font-size:38px;color:var(--navy);margin:0 0 12px}
.thanks p{font-size:20px;color:var(--muted);margin:0}
.hidden{display:none!important}
.admin{
  display:grid;grid-template-columns:1fr 1fr;gap:18px
}
.panel{
  background:var(--white);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 7px 20px rgba(15,55,76,.06)
}
.panel h2{font-size:24px;margin:0 0 18px;color:var(--navy)}
label{display:block;font-size:14px;font-weight:800;margin-bottom:13px;color:var(--text)}
input[type=text],input[type=password]{
  width:100%;margin-top:6px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;
  background:#fff;min-height:50px;font-size:17px;color:var(--text)
}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:none;border-radius:13px;padding:13px 17px;min-height:48px;font-weight:800}
.btn-primary{background:var(--navy);color:#fff}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #f1b6b0}
.result{margin:15px 0}
.result-head{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:800}
.bar{height:13px;border-radius:999px;background:#edf2f5;overflow:hidden;margin-top:7px}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--green))}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.status{min-height:21px;font-size:13px;margin-top:8px}
.ok{color:#218739}.error{color:var(--danger)}
dialog{border:none;border-radius:22px;padding:0;max-width:430px;width:calc(100% - 32px);box-shadow:0 24px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(7,28,43,.42)}
.dialog{padding:26px}
.dialog h2{margin:0 0 8px;color:var(--navy)}
.dialog p{margin:0 0 16px;color:var(--muted)}
@media (max-width:780px){
  .app{padding-left:16px;padding-right:16px}
  .header{padding:26px 22px 22px}
  .choice{grid-template-columns:105px 1px minmax(0,1fr);gap:16px;padding:14px 16px;min-height:118px}
  .iconbox{height:78px}
  .sep{height:66px}
  .num{width:46px;height:46px;flex-basis:46px;font-size:25px;border-width:3px}
  .choice-text{gap:14px}
  .admin{grid-template-columns:1fr}
}
@media (max-width:520px){
  .choice{grid-template-columns:82px minmax(0,1fr);gap:13px}
  .sep{display:none}
  .iconbox{height:70px}
  .label{font-size:25px}
  .num{width:40px;height:40px;flex-basis:40px;font-size:22px}
  .footerline:before,.footerline:after{width:70px}
}
</style>
</head>
<body>
<main class="app">
  <section id="surveyScreen">
    <div class="header">
      <p class="kicker">展示会アンケート</p>
      <h1 id="questionText">オフィスでのお困り事はございますか？</h1>
      <div class="accent"></div>
      <p class="sub">当てはまるものを1つお選びください</p>
    </div>

    <div class="topbar">
      <button id="adminBtn" class="admin-link" type="button">設定・集計</button>
    </div>

    <div class="choices">
      <button class="choice" type="button" data-i="0">
        <div class="iconbox">
          <svg width="92" height="68" viewBox="0 0 92 68" aria-hidden="true">
            <circle cx="46" cy="14" r="8" fill="#1e6ea8"/><circle cx="20" cy="28" r="8" fill="#1e6ea8"/><circle cx="72" cy="28" r="8" fill="#1e6ea8"/>
            <path d="M34 28c0-8 5-13 12-13s12 5 12 13v9H34z" fill="#1e6ea8"/>
            <path d="M8 54V42c0-7 5-12 12-12s12 5 12 12v12zm52 0V42c0-7 5-12 12-12s12 5 12 12v12z" fill="#1e6ea8"/>
            <path d="M24 54l8-15h28l8 15z" fill="#78c8e9" stroke="#1e6ea8" stroke-width="3"/>
            <path d="M38 2v7M26 7l5 5M54 12l5-5" stroke="#66bf45" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="sep"></div>
        <div class="choice-text"><div class="num">1</div><div class="label">会議室不足</div></div>
      </button>

      <button class="choice" type="button" data-i="1">
        <div class="iconbox">
          <svg width="92" height="68" viewBox="0 0 92 68" aria-hidden="true">
            <circle cx="25" cy="45" r="8" fill="#1e6ea8"/><circle cx="67" cy="45" r="8" fill="#1e6ea8"/>
            <path d="M13 65c1-10 5-16 12-16s11 6 12 16zm42 0c1-10 5-16 12-16s11 6 12 16z" fill="#1e6ea8"/>
            <rect x="5" y="8" width="38" height="22" rx="11" fill="#66bf45"/><rect x="49" y="13" width="38" height="22" rx="11" fill="#29a7d6"/>
            <circle cx="16" cy="19" r="2" fill="#fff"/><circle cx="24" cy="19" r="2" fill="#fff"/><circle cx="32" cy="19" r="2" fill="#fff"/>
            <circle cx="60" cy="24" r="2" fill="#fff"/><circle cx="68" cy="24" r="2" fill="#fff"/><circle cx="76" cy="24" r="2" fill="#fff"/>
          </svg>
        </div>
        <div class="sep"></div>
        <div class="choice-text"><div class="num">2</div><div class="label">交流がない</div></div>
      </button>

      <button class="choice" type="button" data-i="2">
        <div class="iconbox">
          <svg width="92" height="68" viewBox="0 0 92 68" aria-hidden="true">
            <path d="M11 28h15l20-15v42L26 40H11z" fill="none" stroke="#1e6ea8" stroke-width="5" stroke-linejoin="round"/>
            <path d="M58 25c6 5 6 13 0 18M68 18c11 9 11 23 0 32M78 11c15 13 15 33 0 46" fill="none" stroke="#66bf45" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="sep"></div>
        <div class="choice-text"><div class="num">3</div><div class="label">音響課題</div></div>
      </button>

      <button class="choice" type="button" data-i="3">
        <div class="iconbox">
          <svg width="92" height="68" viewBox="0 0 92 68" aria-hidden="true">
            <circle cx="18" cy="17" r="8" fill="#66bf45"/><g stroke="#66bf45" stroke-width="3" stroke-linecap="round"><path d="M18 2v6M18 26v6M3 17h6M27 17h6M7 6l4 4M25 24l4 4M29 6l-4 4M11 24l-4 4"/></g>
            <path d="M48 10v31a13 13 0 1 0 12 0V10a6 6 0 0 0-12 0z" fill="#fff" stroke="#1e6ea8" stroke-width="4"/>
            <path d="M54 24v26" stroke="#66bf45" stroke-width="5" stroke-linecap="round"/><circle cx="54" cy="52" r="7" fill="#66bf45"/>
            <g stroke="#1683c2" stroke-width="3" stroke-linecap="round"><path d="M78 15v26M70 20l16 16M86 20L70 36M67 28h22"/></g>
          </svg>
        </div>
        <div class="sep"></div>
        <div class="choice-text"><div class="num">4</div><div class="label">温熱課題</div></div>
      </button>

      <button class="choice" type="button" data-i="4">
        <div class="iconbox">
          <svg width="92" height="68" viewBox="0 0 92 68" aria-hidden="true">
            <circle cx="28" cy="34" r="6" fill="#1e6ea8"/><circle cx="46" cy="34" r="6" fill="#1e6ea8"/><circle cx="64" cy="34" r="6" fill="#1e6ea8"/>
          </svg>
        </div>
        <div class="sep"></div>
        <div class="choice-text"><div class="num">5</div><div class="label">その他</div></div>
      </button>
    </div>

    <div class="footer">
      <div class="footerline">展示会アンケート</div>
      <div class="footer-note" id="answerCount">回答数 0</div>
    </div>
  </section>

  <section id="thanksScreen" class="thanks hidden" aria-live="polite">
    <div class="check">✓</div>
    <h2>ご回答ありがとうございました</h2>
    <p>次のお客様の画面に戻ります。</p>
  </section>

  <section id="adminScreen" class="admin hidden">
    <div class="panel">
      <h2>表示設定</h2>
      <form id="settingsForm">
        <label>見出し<input id="qInput" type="text" maxlength="80"></label>
        <label>選択肢1<input data-edit="0" type="text" maxlength="30"></label>
        <label>選択肢2<input data-edit="1" type="text" maxlength="30"></label>
        <label>選択肢3<input data-edit="2" type="text" maxlength="30"></label>
        <label>選択肢4<input data-edit="3" type="text" maxlength="30"></label>
        <label>選択肢5<input data-edit="4" type="text" maxlength="30"></label>
        <label>管理PIN（4〜8桁）<input id="pinEdit" type="password" inputmode="numeric" maxlength="8"></label>
        <div id="settingsStatus" class="status"></div>
        <div class="buttons">
          <button class="btn btn-primary" type="submit">設定を保存</button>
          <button id="backBtn" class="btn btn-secondary" type="button">回答画面へ戻る</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2>回答集計 <span id="total" style="float:right">0件</span></h2>
      <div id="results"></div>
      <div class="buttons">
        <button id="csvBtn" class="btn btn-secondary" type="button">CSVを書き出す</button>
        <button id="resetBtn" class="btn btn-danger" type="button">回答をリセット</button>
      </div>
      <p class="small" style="margin-top:16px">
        回答はこのiPad内に保存されます。展示会終了時にはCSVを書き出して保管してください。
      </p>
    </div>
  </section>
</main>

<dialog id="pinDialog">
  <div class="dialog">
    <h2>管理画面</h2>
    <p>PINを入力してください。</p>
    <form id="pinForm">
      <input id="pinCheck" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
      <div id="pinStatus" class="status error"></div>
      <div class="buttons">
        <button class="btn btn-primary" type="submit">開く</button>
        <button id="pinCancel" class="btn btn-secondary" type="button">キャンセル</button>
      </div>
    </form>
  </div>
</dialog>

<script>
(()=>{
  const KEY="office-issue-survey-v1";
  const defaults={
    question:"オフィスでのお困り事はございますか？",
    labels:["会議室不足","交流がない","音響課題","温熱課題","その他"],
    counts:[0,0,0,0,0],
    log:[],
    pin:"1234"
  };
  const clone=o=>JSON.parse(JSON.stringify(o));
  let state=load();
  let timer=null;
  const $=s=>document.querySelector(s);
  const $$=s=>[...document.querySelectorAll(s)];

  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(!raw)return clone(defaults);
      const o=JSON.parse(raw);
      return {
        question:typeof o.question==="string"?o.question:defaults.question,
        labels:Array.isArray(o.labels)&&o.labels.length===5?o.labels:defaults.labels.slice(),
        counts:Array.isArray(o.counts)&&o.counts.length===5?o.counts.map(n=>Number(n)||0):[0,0,0,0,0],
        log:Array.isArray(o.log)?o.log.slice(0,30000):[],
        pin:/^[0-9]{4,8}$/.test(String(o.pin||""))?String(o.pin):"1234"
      };
    }catch(e){return clone(defaults);}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state));return true}
    catch(e){alert("端末への保存に失敗しました。Safariの設定をご確認ください。");return false}
  }
  const total=()=>state.counts.reduce((a,b)=>a+b,0);

  function renderSurvey(){
    $("#questionText").textContent=state.question;
    $$(".label").forEach((el,i)=>el.textContent=state.labels[i]);
    $("#answerCount").textContent="回答数 "+total();
  }
  function renderAdmin(){
    $("#qInput").value=state.question;
    $$("[data-edit]").forEach((el,i)=>el.value=state.labels[i]);
    $("#pinEdit").value=state.pin;
    $("#total").textContent=total()+"件";
    const r=$("#results");r.innerHTML="";
    const t=total();
    state.labels.forEach((label,i)=>{
      const pct=t?Math.round(state.counts[i]/t*100):0;
      const d=document.createElement("div");d.className="result";
      d.innerHTML=`<div class="result-head"><span></span><span>${state.counts[i]}件 / ${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>`;
      d.querySelector(".result-head span").textContent=label;
      r.appendChild(d);
    });
  }
  function showSurvey(){
    if(timer){clearTimeout(timer);timer=null}
    $("#adminScreen").classList.add("hidden");
    $("#thanksScreen").classList.add("hidden");
    $("#surveyScreen").classList.remove("hidden");
    renderSurvey();
  }
  function showAdmin(){
    $("#surveyScreen").classList.add("hidden");
    $("#thanksScreen").classList.add("hidden");
    $("#adminScreen").classList.remove("hidden");
    renderAdmin();
  }

  $$(".choice").forEach(btn=>btn.addEventListener("click",()=>{
    const i=Number(btn.dataset.i);
    if(!Number.isInteger(i)||i<0||i>4)return;
    state.counts[i]++;
    state.log.push({timestamp:new Date().toISOString(),choice:i+1,label:state.labels[i]});
    save();
    $("#surveyScreen").classList.add("hidden");
    $("#thanksScreen").classList.remove("hidden");
    timer=setTimeout(showSurvey,1400);
  }));

  $("#adminBtn").addEventListener("click",()=>{
    $("#pinCheck").value="";$("#pinStatus").textContent="";
    $("#pinDialog").showModal();
    setTimeout(()=>$("#pinCheck").focus(),50);
  });
  $("#pinCancel").addEventListener("click",()=>$("#pinDialog").close());
  $("#pinForm").addEventListener("submit",e=>{
    e.preventDefault();
    if($("#pinCheck").value===state.pin){$("#pinDialog").close();showAdmin()}
    else $("#pinStatus").textContent="PINが違います。";
  });

  $("#settingsForm").addEventListener("submit",e=>{
    e.preventDefault();
    const q=$("#qInput").value.trim();
    const labels=$$("[data-edit]").map(x=>x.value.trim());
    const pin=$("#pinEdit").value.trim();
    const s=$("#settingsStatus");
    if(!q||labels.some(v=>!v)){s.className="status error";s.textContent="見出しと5つの選択肢をすべて入力してください。";return}
    if(!/^[0-9]{4,8}$/.test(pin)){s.className="status error";s.textContent="PINは4〜8桁の数字で入力してください。";return}
    state.question=q;state.labels=labels;state.pin=pin;
    if(save()){s.className="status ok";s.textContent="設定を保存しました。";renderSurvey();renderAdmin()}
  });
  $("#backBtn").addEventListener("click",showSurvey);

  $("#resetBtn").addEventListener("click",()=>{
    if(!confirm("回答をすべて削除しますか？"))return;
    state.counts=[0,0,0,0,0];state.log=[];save();renderAdmin();renderSurvey();
  });

  $("#csvBtn").addEventListener("click",()=>{
    const rows=[["timestamp","choice","label"]];
    state.log.forEach(x=>rows.push([x.timestamp,x.choice,x.label]));
    const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
    const csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    a.href=url;a.download=`office-issues-${stamp}.csv`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  });

  renderSurvey();
  if("serviceWorker" in navigator){
    addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
